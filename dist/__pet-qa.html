<!doctype html><html lang="es"><meta charset="utf-8"><title>Prueba local de accesorios</title><style>body{background:#f2f5e9;color:#174f48;font:16px system-ui;margin:20px}#dog{height:490px;max-width:760px}button{padding:10px;margin:4px}output{display:block}</style><h1>Accesorios de Toby</h1><div id="dog"></div><nav><button data-outfit="none">Al natural</button><button data-outfit="scarf">Pañuelo</button><button data-outfit="cap">Gorra</button><button data-outfit="sweater">Suéter</button><button data-outfit="crown">Corona</button></nav><output>Al natural</output><script type="module">import{mountDog}from './dog-scene.js';const pet={name:'Toby',outfit:'none',fed:3};const scene=mountDog(document.querySelector('#dog'),pet);document.querySelectorAll('button').forEach(b=>b.onclick=()=>{pet.outfit=b.dataset.outfit;scene.update(pet);document.querySelector('output').textContent=b.textContent});window.addEventListener('pagehide',()=>scene.dispose());</script></html>
